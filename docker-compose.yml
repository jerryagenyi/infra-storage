name: shared-storage

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - minio-data:/data
    networks:
      - shared-services
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./scripts/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_VEXA_ACCESS_KEY=${MINIO_VEXA_ACCESS_KEY}
      - MINIO_VEXA_SECRET_KEY=${MINIO_VEXA_SECRET_KEY}
      - MINIO_CA_ACCESS_KEY=${MINIO_CA_ACCESS_KEY}
      - MINIO_CA_SECRET_KEY=${MINIO_CA_SECRET_KEY}
      - MINIO_ZC_ACCESS_KEY=${MINIO_ZC_ACCESS_KEY}
      - MINIO_ZC_SECRET_KEY=${MINIO_ZC_SECRET_KEY}
    networks:
      - shared-services

  whisper-stt:
    image: fedirz/faster-whisper-server:latest-cpu
    environment:
      - WHISPER__MODEL=small
      - WHISPER__DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - whisper-models:/root/.cache/huggingface
    networks:
      - shared-services
    restart: unless-stopped

volumes:
  minio-data:
  whisper-models:

networks:
  shared-services:
    name: shared-services
    driver: bridge
